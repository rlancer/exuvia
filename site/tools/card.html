<!doctype html>
<!-- The social card (public/og.png). Rendered by `node tools/capture.mjs card`
     straight from this file, so it needs no dev server. Colours and fonts
     match src/styles/global.css. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "IM Fell Double Pica";
        src: url("../node_modules/@fontsource/im-fell-double-pica/files/im-fell-double-pica-latin-400-normal.woff2");
      }
      @font-face {
        font-family: "EB Garamond";
        font-weight: 400 800;
        src: url("../node_modules/@fontsource-variable/eb-garamond/files/eb-garamond-latin-wght-normal.woff2");
      }
      @font-face {
        font-family: "Courier Prime";
        font-weight: 700;
        src: url("../node_modules/@fontsource/courier-prime/files/courier-prime-latin-700-normal.woff2");
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
        width: 1200px;
        height: 630px;
        padding: 52px 64px 44px;
        background: #f3f0e6;
        color: #111110;
        font-family: "EB Garamond", serif;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-family: "IM Fell Double Pica", serif;
        font-size: 46px;
        line-height: 1;
      }
      .brand span {
        padding-bottom: 6px;
      }
      .body {
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        gap: 40px;
        align-items: center;
      }
      h1 {
        font-family: "IM Fell Double Pica", serif;
        font-size: 78px;
        font-weight: 400;
        line-height: 0.98;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }
      img {
        display: block;
        width: 100%;
      }
      .foot {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding-top: 18px;
        border-top: 3px solid #111110;
        font-size: 26px;
        white-space: nowrap;
      }
      .foot b {
        font-family: "Courier Prime", monospace;
        font-size: 24px;
      }
      .foot b i {
        color: #2f5fd6;
        font-style: normal;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 32 32">
        <rect width="32" height="32" fill="#6d9cfe" />
        <path
          d="M7 9c8 0 10 14 18 14M7 23c8 0 10-14 18-14"
          stroke="#111110"
          stroke-width="3"
          fill="none"
          stroke-linecap="square"
        />
      </svg>
      <span>exuvia</span>
    </div>
    <div class="body">
      <h1>A data workbench where the graph is the interface</h1>
      <img src="../src/assets/lobster.png" alt="" />
    </div>
    <div class="foot">
      <span>Plain Python and SQL files, per-node schedules, an agent on the graph.</span>
      <b><i>$</i> pip install exuvia</b>
    </div>
  </body>
</html>
