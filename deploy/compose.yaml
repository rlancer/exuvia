# exuvia as a hub: many projects, each with its API under /p/<project>/api
# and the web UI at /p/<project>/ (README "Hub"). The UI is built into the
# image, so this one service is the whole deployment: there is no separate
# frontend. For Docker Compose and Podman Compose on one host; on a Docker
# Swarm use swarm.yaml (Swarm secrets, placement, stop-first updates).
#
# This file is all you need, no clone:
#   curl -O https://raw.githubusercontent.com/rlancer/exuvia/main/deploy/compose.yaml
#
#   EXUVIA_API_TOKEN=change-me docker compose up -d --wait --pull always
#
# `--pull always` fetches the current `latest` even when the host already has
# an older one (Compose otherwise reuses it).
#
# Then: curl http://localhost:7420/healthz
#       curl -H "Authorization: Bearer change-me" -X POST http://localhost:7420/api/projects \
#            -H "Content-Type: application/json" -d '{"id": "demo"}'
#       open http://localhost:7420/?token=change-me   (the hub's home page, where
#       you open demo's workbench or create projects; the token is needed
#       once, the browser keeps it in a cookie; not at all with
#       EXUVIA_BROWSER_AUTH=open, below)
#
# Variables (put them in a .env next to this file, or export them):
#   EXUVIA_API_TOKEN   required: clients send `Authorization: Bearer <token>`
#   EXUVIA_IMAGE       default ghcr.io/rlancer/exuvia:latest (public, no login);
#                      pin a release with ghcr.io/rlancer/exuvia:0.3, or name an
#                      image with your nodes' packages (README "Deploying")
#   EXUVIA_PORT        host port, default 7420
#   EXUVIA_BROWSER_AUTH  `open`: browsers get in without entering the token
#                      (agents and the API still need it); only for a hub that
#                      only a private network can reach
#   EXUVIA_AUTH        `headers`: a sign-in proxy in front of the hub (company
#                      SSO, oauth2-proxy) says who each person is in
#                      X-Forwarded-User / X-Forwarded-Email; requests without
#                      them get a 401 unless they carry the token (agents).
#                      Only when nothing but that proxy can reach the hub
#   EXUVIA_AUTH_USER_HEADER / EXUVIA_AUTH_EMAIL_HEADER  other header names
#   EXUVIA_AUTH_TRUSTED_PROXIES  the proxy's IPs or CIDRs: identity headers
#                      from any other address are ignored
#                      (README "Schedules, auth and settings")
#   ANTHROPIC_API_KEY  optional: turns on the built-in agent (or OPENROUTER_API_KEY)
#
# For a single project at / instead of a hub, replace `command` with
#   ["exuvia", "serve", "/data/project", "--host", "0.0.0.0", "--port", "7420"]
#
# Records (SQLite) and outputs live in the `exuvia-data` volume. Run one
# replica: a hub owns its directory. To survive losing the volume, point
# EXUVIA_DB at Postgres and EXUVIA_ARTIFACT_STORE at a bucket (README "Deploying").
#
# EXUVIA_ARTIFACT_STORE can share an existing bucket: exuvia only touches keys
# under the URL's prefix. Always give one (s3://bucket/exuvia, never a bare
# s3://bucket), and give each deployment its own (exuvia-prod, exuvia-staging):
# keys are per project id, so two hubs on one prefix overwrite each other
# (README "Outputs in an existing bucket").
#
# A hostname with TLS: don't expose the hub without TLS. Point the hostname's
# DNS at this host and set EXUVIA_HOST to it (in the .env), then either:
#   - No proxy on this host yet (nothing listening on ports 80 and 443):
#     uncomment the `caddy` service and the `caddy-data` volume below. Caddy
#     gets a Let's Encrypt certificate for EXUVIA_HOST by itself and passes
#     the event stream through unbuffered.
#   - A Traefik already on this host (Docker provider): uncomment the hub's
#     `labels` and the `proxy` network instead, and use the entrypoint, cert
#     resolver and network names that Traefik uses (`docker inspect` on its
#     container shows them; the ones below are examples).
# Either way, change the hub's port to "127.0.0.1:${EXUVIA_PORT:-7420}:7420"
# so only this host reaches it directly, then check
# https://<EXUVIA_HOST>/healthz. Any other proxy works the same way: route the
# whole host (/, /p/..., /api/..., /assets/...) to port 7420, and don't
# buffer /p/<project>/api/events, a long-lived event stream.

services:
  hub:
    image: ${EXUVIA_IMAGE:-ghcr.io/rlancer/exuvia:latest}
    command: ["exuvia", "hub", "/data", "--host", "0.0.0.0", "--port", "7420"]
    ports:
      - "${EXUVIA_PORT:-7420}:7420"
    environment:
      EXUVIA_API_TOKEN: ${EXUVIA_API_TOKEN:?set EXUVIA_API_TOKEN}
      EXUVIA_BROWSER_AUTH: ${EXUVIA_BROWSER_AUTH:-token}
      EXUVIA_AUTH: ${EXUVIA_AUTH:-token}
      EXUVIA_AUTH_USER_HEADER: ${EXUVIA_AUTH_USER_HEADER:-}
      EXUVIA_AUTH_EMAIL_HEADER: ${EXUVIA_AUTH_EMAIL_HEADER:-}
      EXUVIA_AUTH_TRUSTED_PROXIES: ${EXUVIA_AUTH_TRUSTED_PROXIES:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - exuvia-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7420/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    # labels:  # an existing Traefik (v3; v2 too)
    #   traefik.enable: "true"
    #   traefik.http.routers.exuvia.rule: Host(`${EXUVIA_HOST}`)
    #   traefik.http.routers.exuvia.entrypoints: websecure
    #   traefik.http.routers.exuvia.tls.certresolver: letsencrypt
    #   traefik.http.services.exuvia.loadbalancer.server.port: "7420"
    #   traefik.docker.network: proxy
    # networks: [default, proxy]

  # caddy:  # no proxy yet: TLS for EXUVIA_HOST on ports 80 and 443
  #   image: caddy:2
  #   command: ["caddy", "reverse-proxy", "--from", "${EXUVIA_HOST:?set EXUVIA_HOST}", "--to", "hub:7420"]
  #   ports: ["80:80", "443:443"]
  #   volumes: [caddy-data:/data]  # the certificate, kept across restarts
  #   restart: unless-stopped

volumes:
  exuvia-data:
  # caddy-data:

# networks:  # with the Traefik labels: Traefik's network, by its real name
#   proxy:
#     external: true
