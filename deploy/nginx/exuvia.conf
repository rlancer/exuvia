# nginx in front of an exuvia hub, with a cache for the data API (/api/data/).
# An example: put it in /etc/nginx/conf.d/ (it is read inside `http { }`), and
# change `server exuvia:7420` to where the hub listens and `listen` to taste.
# Traefik (compose.yaml, swarm.yaml) has no cache of its own: put this between
# it and the hub, or use it instead.
#
# What the cache does depends on the hub's EXUVIA_DATA_CACHE_SECONDS:
#
# * 0 (the default): data answers say `Cache-Control: no-cache`, which nginx
#   never stores. Clients that keep answers (browsers) still send
#   If-None-Match, which goes through to the hub: it answers 304 without
#   running the query. Nothing is ever stale.
# * N: answers say `public, max-age=N, stale-while-revalidate=N`. nginx keeps
#   each one N seconds, then asks the hub again with If-None-Match
#   (proxy_cache_revalidate: a 304 costs the hub no query) while it goes on
#   answering with the old one. An answer is at most about 2 x N seconds old.
#
# The cache key has the request's Authorization header: a data key's answers
# are never another key's, and a key that can't read a project never gets an
# answer for it from the cache. Keep it there. The hub also sends
# `Vary: Authorization, Accept`.
#
# Only GET is cached (nginx's default): send queries as
# `GET /api/data/query?sql=...` to have them cached. Their SQL is then in the
# access log, and the URL is limited by large_client_header_buffers below.

proxy_cache_path /var/cache/nginx/exuvia levels=1:2 keys_zone=exuvia_data:10m
                 max_size=1g inactive=10m use_temp_path=off;

upstream exuvia_hub {
    server exuvia:7420;
    keepalive 32;
}

# The If-None-Match the hub gets: nginx's own when it revalidates an answer it
# keeps, else the client's. nginx drops the client's by default when it caches,
# so the hub could never answer it 304 for an answer nginx did not keep.
map $upstream_cache_etag $exuvia_if_none_match {
    ""      $http_if_none_match;
    default $upstream_cache_etag;
}

map $http_upgrade $exuvia_connection {
    default upgrade;
    ""      "";
}

server {
    listen 80;

    # GET /api/data/query?sql=... : a request line of up to 16 KB.
    large_client_header_buffers 4 16k;
    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/data/ {
        proxy_pass http://exuvia_hub;
        proxy_set_header Connection "";

        proxy_cache exuvia_data;
        # If-None-Match is in the key too: an answer to a conditional request
        # (a 304) is only ever an answer to that same one.
        proxy_cache_key "$scheme$host$request_uri|$http_authorization|$http_accept|$http_if_none_match";
        proxy_set_header If-None-Match $exuvia_if_none_match;
        proxy_cache_revalidate on;
        # While one request fetches a newer answer, the others get the one
        # kept (only then: never because the hub failed, which would keep an
        # answer past its bound), so one request per answer reaches the hub.
        proxy_cache_use_stale updating;
        proxy_cache_background_update on;
        # proxy_cache_lock would also hold back requests for an answer nginx
        # does not have yet, but its waiters look again only every 500 ms, and
        # it locks for answers nginx will not keep (`no-cache`) too: in
        # scripts/loadtest_data_api.py it took the p99 of 8 clients from about
        # 50 ms to 1 s, and the slowest request to 4.5 s. The hub runs one
        # build of a query's connection for requests that miss together.
        proxy_cache_lock off;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Everything else (the workbench, its event streams, MCP): not cached.
    location / {
        proxy_pass http://exuvia_hub;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $exuvia_connection;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
