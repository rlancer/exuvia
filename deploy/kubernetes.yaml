# exuvia as a headless hub on Kubernetes: many projects behind one API, each
# under /p/<project>/api (README "Hub").
#
#   kubectl create namespace exuvia
#   kubectl -n exuvia create secret generic exuvia --from-literal=api-token=change-me
#   kubectl -n exuvia apply -f https://raw.githubusercontent.com/rlancer/exuvia/main/deploy/kubernetes.yaml
#   kubectl -n exuvia rollout status deployment/exuvia-hub
#   kubectl -n exuvia port-forward service/exuvia-hub 7420:7420
#   curl http://localhost:7420/healthz
#
# The image defaults to ghcr.io/rlancer/exuvia:latest (public, no login). To pin
# a release (ghcr.io/rlancer/exuvia:0.3) or use an image with your nodes'
# packages, change `image` below (or `kubectl -n exuvia set image
# deployment/exuvia-hub hub=<image>`); the cluster must be able to pull it.
#
# To turn on the built-in agent, add `anthropic-api-key` to the secret and
# uncomment ANTHROPIC_API_KEY below. For one project with the web UI instead of
# a hub, change `args` to ["exuvia", "serve", "/data/project", "--host",
# "0.0.0.0", "--port", "7420"]. Put an Ingress (or a LoadBalancer Service) in
# front to reach it from outside the cluster.
#
# One replica with a ReadWriteOnce volume: a hub owns its directory, so the
# rollout strategy is Recreate. To scale out or survive losing the volume,
# point EXUVIA_DB at Postgres and EXUVIA_ARTIFACT_STORE at a bucket
# (README "Deploying").
#
# EXUVIA_ARTIFACT_STORE can share an existing bucket: exuvia only touches keys
# under the URL's prefix. Always give one (s3://bucket/exuvia, never a bare
# s3://bucket), and give each deployment its own (exuvia-prod, exuvia-staging):
# keys are per project id, so two hubs on one prefix overwrite each other
# (README "Outputs in an existing bucket").
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: exuvia-data
  labels: {app.kubernetes.io/name: exuvia}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exuvia-hub
  labels: {app.kubernetes.io/name: exuvia, app.kubernetes.io/component: hub}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: exuvia, app.kubernetes.io/component: hub}
  template:
    metadata:
      labels: {app.kubernetes.io/name: exuvia, app.kubernetes.io/component: hub}
    spec:
      securityContext:
        runAsUser: 10001  # the image's `exuvia` user
        runAsGroup: 10001
        fsGroup: 10001  # makes the volume writable for it
      containers:
        - name: hub
          image: ghcr.io/rlancer/exuvia:latest
          imagePullPolicy: IfNotPresent
          args: ["exuvia", "hub", "/data", "--host", "0.0.0.0", "--port", "7420"]
          ports:
            - {name: http, containerPort: 7420}
          env:
            - name: EXUVIA_API_TOKEN
              valueFrom:
                secretKeyRef: {name: exuvia, key: api-token}
            # - name: ANTHROPIC_API_KEY
            #   valueFrom:
            #     secretKeyRef: {name: exuvia, key: anthropic-api-key}
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 2Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: exuvia-data}
---
apiVersion: v1
kind: Service
metadata:
  name: exuvia-hub
  labels: {app.kubernetes.io/name: exuvia, app.kubernetes.io/component: hub}
spec:
  selector: {app.kubernetes.io/name: exuvia, app.kubernetes.io/component: hub}
  ports:
    - {name: http, port: 7420, targetPort: http}
