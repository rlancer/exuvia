# exuvia as a hub on Kubernetes: many projects, each with its API under
# /p/<project>/api and the web UI at /p/<project>/ (README "Hub"). The UI is
# built into the image, so this Deployment is the whole thing: there is no
# separate frontend.
#
#   kubectl create namespace exuvia
#   kubectl -n exuvia create secret generic exuvia --from-literal=api-token=change-me
#   kubectl -n exuvia apply -f https://raw.githubusercontent.com/rlancer/exuvia/main/deploy/kubernetes.yaml
#   kubectl -n exuvia rollout status deployment/exuvia-hub
#   kubectl -n exuvia port-forward service/exuvia-hub 7420:7420
#   curl http://localhost:7420/healthz
#   open http://localhost:7420/?token=change-me   (the hub's home: create and open projects)
#
# The image defaults to ghcr.io/rlancer/exuvia:latest (public, no login). To pin
# a release (ghcr.io/rlancer/exuvia:0.3) or use an image with your nodes'
# packages, change `image` below (or `kubectl -n exuvia set image
# deployment/exuvia-hub hub=<image>`); the cluster must be able to pull it.
#
# To turn on the built-in agent, add `anthropic-api-key` to the secret and
# uncomment ANTHROPIC_API_KEY below. For a single project at / instead of a
# hub, change `args` to ["exuvia", "serve", "/data/project", "--host",
# "0.0.0.0", "--port", "7420"].
#
# A hostname for the UI and API: port-forward is only for checking it. To
# reach the hub at https://<host>/ from outside the cluster, uncomment the
# Ingress at the bottom of this file and replace exuvia.example.com (twice)
# with your hostname, whose DNS points at the cluster's ingress controller
# (`kubectl get ingressclass`; `kubectl -n <its namespace> get service` shows
# its external address). Traefik reads only Ingress resources and its own
# IngressRoute on Kubernetes, never labels, so there are no Traefik labels
# here (those are Swarm's, deploy/swarm.yaml). The Ingress routes the whole
# host (/, /p/..., /api/..., /assets/...) to the Service; the hub then serves
# the workbench at https://<host>/p/<project>/. With cert-manager, the
# annotation gets a certificate into the `exuvia-tls` secret; without it,
# create that secret from your own certificate (kubectl create secret tls), or
# the controller serves its default self-signed one. Don't expose the hub
# without TLS. /p/<project>/api/events is a long-lived event stream with a
# ping every few seconds: Traefik passes it through as is; on ingress-nginx,
# add the proxy-buffering annotation shown.
#
# One replica with a ReadWriteOnce volume: a hub owns its directory, so the
# rollout strategy is Recreate. To scale out or survive losing the volume,
# point EXUVIA_DB at Postgres and EXUVIA_ARTIFACT_STORE at a bucket
# (README "Deploying").
#
# EXUVIA_ARTIFACT_STORE can share an existing bucket: exuvia only touches keys
# under the URL's prefix. Always give one (s3://bucket/exuvia, never a bare
# s3://bucket), and give each deployment its own (exuvia-prod, exuvia-staging):
# keys are per project id, so two hubs on one prefix overwrite each other
# (README "Outputs in an existing bucket").
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: exuvia-data
  labels: {app.kubernetes.io/name: exuvia}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exuvia-hub
  labels: {app.kubernetes.io/name: exuvia, app.kubernetes.io/component: hub}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: exuvia, app.kubernetes.io/component: hub}
  template:
    metadata:
      labels: {app.kubernetes.io/name: exuvia, app.kubernetes.io/component: hub}
    spec:
      securityContext:
        runAsUser: 10001  # the image's `exuvia` user
        runAsGroup: 10001
        fsGroup: 10001  # makes the volume writable for it
      containers:
        - name: hub
          image: ghcr.io/rlancer/exuvia:latest
          imagePullPolicy: Always  # `latest` moves; don't reuse a node's older copy
          args: ["exuvia", "hub", "/data", "--host", "0.0.0.0", "--port", "7420"]
          ports:
            - {name: http, containerPort: 7420}
          env:
            - name: EXUVIA_API_TOKEN
              valueFrom:
                secretKeyRef: {name: exuvia, key: api-token}
            # - name: ANTHROPIC_API_KEY
            #   valueFrom:
            #     secretKeyRef: {name: exuvia, key: anthropic-api-key}
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 2Gi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: exuvia-data}
---
apiVersion: v1
kind: Service
metadata:
  name: exuvia-hub
  labels: {app.kubernetes.io/name: exuvia, app.kubernetes.io/component: hub}
spec:
  selector: {app.kubernetes.io/name: exuvia, app.kubernetes.io/component: hub}
  ports:
    - {name: http, port: 7420, targetPort: http}
# Hostname: uncomment, and set your host in `tls` and `rules` (see the top).
# ---
# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: exuvia-hub
#   labels: {app.kubernetes.io/name: exuvia}
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt  # only with cert-manager; your issuer's name
#     # traefik.ingress.kubernetes.io/router.entrypoints: websecure  # Traefik: HTTPS only
#     # nginx.ingress.kubernetes.io/proxy-buffering: "off"  # ingress-nginx: don't buffer the event stream
# spec:
#   # ingressClassName: traefik  # leave out to use the cluster's default class (k3s: traefik)
#   tls:
#     - {hosts: [exuvia.example.com], secretName: exuvia-tls}
#   rules:
#     - host: exuvia.example.com
#       http:
#         paths:
#           - path: /
#             pathType: Prefix
#             backend: {service: {name: exuvia-hub, port: {name: http}}}
