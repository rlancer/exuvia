[project]
name = "exuvia"
version = "0.2.0"
description = "An AI-first, file-backed DAG workbench for analysts: Python/SQL nodes, per-node schedules, a live graph UI, and a Claude agent that builds pipelines with you."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "starlette>=0.39",  # FileResponse answers Range requests (GET /api/artifacts/...)
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "pyarrow>=17",
    "duckdb>=1.1",
    "croniter>=3.0",
    "watchfiles>=0.24",
    "anthropic>=1.0",
    "openai>=1.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# EXUVIA_DB=postgresql://... (see exuvia/db.py)
postgres = ["psycopg[binary]>=3.2"]
mcp = [
    "mcp>=2.3,<3",  # the 2.x server API (exuvia/mcp_server.py)
]

[project.scripts]
exuvia = "exuvia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["exuvia"]
# The built UI is gitignored; `artifacts` ships it anyway. The sdist needs it
# too because `uv build` builds the wheel from the sdist.
artifacts = ["exuvia/static/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["exuvia/static/**"]
# The website is not part of the package.
exclude = ["/site"]

[tool.pytest.ini_options]
testpaths = ["tests"]
