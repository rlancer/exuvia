[tools]
node = "24.12.0"
python = "3.12.11"
uv = "latest"

[env]
PYTHONUNBUFFERED = "1"

# NOTE: mise on Windows only executes the first line of a multi-line `run`,
# so multi-step tasks are chained on one line with `&&`.
[tasks.sync]
description = "Install Python (uv) and UI (npm) dependencies"
run = "uv sync --extra dev && cd ui && npm install"

[tasks.ui-build]
description = "Build the UI into exuvia/static (served by `exuvia serve`)"
run = "cd ui && npm run build"

[tasks.ui-dev]
description = "Vite dev server on :5180, proxying /api to exuvia on :7420"
run = "cd ui && npm run dev"

[tasks.site-dev]
description = "Website (landing page + docs) dev server on :4380"
run = "cd site && npm install && npm run dev"

[tasks.site-build]
description = "Typecheck and build the website into site/dist"
run = "cd site && npm install && npm run build"

[tasks.site-cf-dev]
description = "Build the website and serve it with wrangler on :8787"
run = "cd site && npm install && npm run build && npm run cf:dev"

[tasks.site-deploy]
description = "Build the website and deploy it to https://exuvia.lobster.mp/ (needs `wrangler login`)"
env = { SITE_URL = "https://exuvia.lobster.mp" }
run = "cd site && npm ci && npm run build && npm run deploy"

[tasks.demo]
description = "Serve the example markets project on http://127.0.0.1:7420"
run = "uv run exuvia serve examples/markets"

[tasks.test]
description = "Run the Python test suite"
run = "uv run pytest -q"

[tasks.e2e]
description = "Build the container image and drive a hub in it over HTTP (podman, else docker; CONTAINER_ENGINE overrides)"
run = "python tests/e2e/container_e2e.py"
