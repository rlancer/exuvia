[tools]
bun = "1.4.5"
python = "3.12.11"
uv = "latest"
# Lints .github/workflows (`mise run lint-actions`); actionlint runs
# shellcheck over `run:` scripts when it is on PATH.
actionlint = "1.7.12"
shellcheck = "0.11.0"

[env]
PYTHONUNBUFFERED = "1"

# NOTE: mise on Windows only executes the first line of a multi-line `run`,
# so multi-step tasks are chained on one line with `&&`.
# sync, ui-build and demo go through scripts/dev.py, which keeps uv's and
# bun's caches and the built UI in the clone's git dir, shared by every
# worktree: a fresh worktree is ready in seconds.
[tasks.sync]
description = "Install Python (uv) and UI (bun) dependencies"
run = "python scripts/dev.py sync"

[tasks.ui-build]
description = "Build the UI into exuvia/static (served by `exuvia serve`), reusing the build of an identical ui/"
run = "python scripts/dev.py ui-build"

[tasks.ui-typecheck]
description = "Typecheck the UI (`bun run build`, as CI runs it, typechecks too)"
run = "cd ui && bun run typecheck"

[tasks.ui-test]
description = "Views runtime unit tests (Vitest; `bun test` would run bun's own runner instead)"
run = "cd ui && bun run test"

[tasks.ui-dev]
description = "Vite dev server on :5180, proxying /api to exuvia on :7420"
run = "cd ui && bun run dev"

[tasks.site-dev]
description = "Website (landing page + docs) dev server on :4380"
run = "cd site && bun install && bun run dev"

[tasks.site-build]
description = "Typecheck and build the website into site/dist"
run = "cd site && bun install && bun run build"

[tasks.site-cf-dev]
description = "Build the website and serve it with wrangler on :8787"
# The one step on Node: `wrangler dev`'s local Workers runtime answers 503
# when wrangler itself runs on bun (`wrangler deploy` is fine on bun).
tools = { node = "24.12.0" }
run = "cd site && bun install && bun run build && node node_modules/wrangler/bin/wrangler.js dev"

[tasks.site-deploy]
description = "Build the website and deploy it to https://exuvia.lobster.mp/ (needs `wrangler login`)"
env = { SITE_URL = "https://exuvia.lobster.mp" }
run = "cd site && bun install --frozen-lockfile && bun run build && bun run deploy"

[tasks.demo]
description = "Build the UI if needed and serve the example markets project on http://127.0.0.1:7420"
run = "python scripts/dev.py demo"

[tasks.test]
description = "Run the Python test suite"
run = "uv run pytest -q"

[tasks.lint-actions]
description = "Lint the GitHub Actions workflows with actionlint, and their scripts with shellcheck"
run = "actionlint && shellcheck .github/scripts/bg.sh .github/scripts/kind-deploy.sh"

[tasks.e2e]
description = "Build the container image and drive a hub in it over HTTP (podman, else docker; CONTAINER_ENGINE overrides)"
run = "python tests/e2e/container_e2e.py"

[tasks.agent-e2e]
description = "Hand the README setup prompt to a coding agent (Grok 4.5 by default) and check the project, MCP server and an analysis it builds"
run = "python tests/e2e/agent_setup_e2e.py"
