name: Image

# The container image (Dockerfile) for linux/amd64 and linux/arm64. Run on a
# `v*` tag, it pushes the image to ghcr.io/rlancer/exuvia as <version>,
# <major>.<minor> and latest, the image deploy/compose.yaml and
# deploy/kubernetes.yaml pull. release.yml starts it on the tag it creates
# when a package change reaches main (workflow_dispatch); a tag pushed by
# hand starts it too (push). The tag is the version baked into the image.
# Pull requests that touch the image build both platforms without pushing, so
# a broken multi-arch build shows up before a release does. Started by hand on
# a branch, it also builds without pushing.
#
# GHCR makes a new package private; after the first push, set it to public
# once (package settings → Change visibility) so anyone can pull it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/image.yml
      - pyproject.toml
      - uv.lock
      - ui/package.json
      - ui/package-lock.json

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build the image (push on tags)
    env:
      # Only a run on a tag publishes, whichever event started it.
      RELEASE: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # The build context has no git history, so the version goes in as a
      # build argument (Dockerfile: EXUVIA_VERSION); other builds get 0.0.0.
      - name: Version from the tag
        id: version
        run: |
          if [ "$RELEASE" = "true" ]; then
            if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "images are released only from a vX.Y.Z tag (got ${GITHUB_REF_NAME})"; exit 1
            fi
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.RELEASE == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # latest follows the newest semver tag (metadata-action's default).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.RELEASE == 'true' }}
          build-args: EXUVIA_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
