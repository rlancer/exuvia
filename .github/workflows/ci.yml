name: CI

# Python tests, UI build, and the container image (remote executor run plus
# the hub end-to-end test, tests/e2e/container_e2e.py). The website (site/) is
# built and deployed by deploy-site.yml, so changes that touch only it, or only
# Markdown, skip the two heavy jobs.
#
# The `main` ruleset requires both heavy jobs' checks on every PR, so pull
# requests always start this workflow (no paths filter): `changes` decides
# whether anything besides site/ and Markdown changed, and when nothing did
# the heavy jobs are skipped, which reports them as passing. If `changes`
# itself fails they run anyway, so a broken filter never lets code through
# untested. Pushes to main keep the paths filter; nothing requires checks there.

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "**.md"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=$(git diff --name-only "$BASE...$HEAD" | grep -vE '^site/|\.md$' || true)
          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            printf 'Code changes:\n%s\n' "$code"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only site/ and Markdown changed: skipping tests and the image build."
          fi

  test:
    name: Python tests + UI build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The record-store tests also run against Postgres (tests/test_revisions.py).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Python tests
        env:
          EXUVIA_TEST_POSTGRES_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
        run: uv sync --extra dev --extra postgres --extra mcp --python 3.12 && uv run pytest -q

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI typecheck + build
        run: cd ui && npm ci && npm run build

      - name: Views runtime unit tests
        run: cd ui && npm test

      - name: CLI smoke (run example DAG headless)
        run: uv run exuvia run examples/markets && uv run exuvia status examples/markets

  container:
    name: Executor image + remote run
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build image
        run: docker build -t exuvia:ci .

      - name: Start executor container
        run: |
          docker run -d --name exuvia-exec -p 8080:8080 -e EXUVIA_EXECUTOR_TOKEN=ci-token exuvia:ci
          for _ in $(seq 1 60); do curl -fs http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs exuvia-exec; exit 1

      - name: Run the example DAG on the container
        env:
          EXUVIA_EXECUTOR_URL: http://127.0.0.1:8080
          EXUVIA_EXECUTOR_TOKEN: ci-token
        run: |
          uv sync --python 3.12
          uv run exuvia run examples/markets
          uv run exuvia status examples/markets | tee status.txt
          ! grep -vq "fresh" status.txt

      - name: Hub end-to-end (the same image, driven over HTTP)
        env:
          CONTAINER_ENGINE: docker
          E2E_IMAGE: exuvia:ci
          E2E_SKIP_BUILD: "1"
        run: python3 tests/e2e/container_e2e.py

      # The deploy/ recipes, each brought up with the image built above and
      # tested with the same script in URL mode.
      - name: Deploy with Compose (deploy/compose.yaml)
        env:
          EXUVIA_IMAGE: exuvia:ci
          EXUVIA_API_TOKEN: ci-token
          EXUVIA_PORT: "7420"
          E2E_URL: http://127.0.0.1:7420
          E2E_TOKEN: ci-token
        run: |
          docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 120
          python3 tests/e2e/container_e2e.py || { docker compose -f deploy/compose.yaml logs; exit 1; }
          docker compose -f deploy/compose.yaml down -v

      - name: Deploy as a Swarm stack (deploy/compose.yaml)
        env:
          EXUVIA_IMAGE: exuvia:ci
          EXUVIA_API_TOKEN: ci-token
          EXUVIA_PORT: "7421"
          E2E_URL: http://127.0.0.1:7421
          E2E_TOKEN: ci-token
        run: |
          docker swarm init
          docker stack deploy -c deploy/compose.yaml --resolve-image never --detach=false exuvia
          python3 tests/e2e/container_e2e.py || { docker service ps --no-trunc exuvia_hub; docker service logs exuvia_hub; exit 1; }
          docker stack rm exuvia

      - name: Deploy to Kubernetes on kind (deploy/kubernetes.yaml)
        env:
          E2E_URL: http://127.0.0.1:7422
          E2E_TOKEN: ci-token
        run: |
          kind create cluster --name exuvia --wait 120s
          kind load docker-image exuvia:ci --name exuvia
          kubectl create namespace exuvia
          kubectl -n exuvia create secret generic exuvia --from-literal=api-token=ci-token
          sed 's#ghcr.io/rlancer/exuvia:latest#exuvia:ci#' deploy/kubernetes.yaml | kubectl -n exuvia apply -f -
          diagnose() { kubectl -n exuvia get all,pvc; kubectl -n exuvia describe pods; kubectl -n exuvia logs deployment/exuvia-hub --all-containers || true; }
          kubectl -n exuvia rollout status deployment/exuvia-hub --timeout=180s || { diagnose; exit 1; }
          kubectl -n exuvia port-forward service/exuvia-hub 7422:7420 >/tmp/port-forward.log 2>&1 &
          python3 tests/e2e/container_e2e.py || { diagnose; cat /tmp/port-forward.log; exit 1; }

      - name: Executor logs
        if: always()
        run: docker logs exuvia-exec || true
