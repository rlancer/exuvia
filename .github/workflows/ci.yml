name: CI

# Python tests, UI build, and the container image (remote executor run plus
# the hub end-to-end test, tests/e2e/container_e2e.py). The website (site/) is
# built and deployed by deploy-site.yml, so changes that touch only it (site/,
# deploy-site.yml), or only Markdown, skip the two heavy jobs.
#
# The `main` ruleset requires both heavy jobs' checks on every PR, so pull
# requests always start this workflow (no paths filter): `changes` decides
# whether anything besides the site and Markdown changed, and when nothing did
# the heavy jobs are skipped, which reports them as passing. If `changes`
# itself fails they run anyway, so a broken filter never lets code through
# untested. Pushes to main keep the paths filter; nothing requires checks there.
#
# Both heavy jobs overlap their slow parts to keep a run short. The tests run
# on one pytest worker per core. The container job brings the kind cluster up
# while the image builds, and loads the image into it while the Compose and
# Swarm steps run (.github/scripts/bg.sh runs a command in the background and
# a later step collects its log and exit status).

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", ".github/workflows/deploy-site.yml", "**.md"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=$(git diff --name-only "$BASE...$HEAD" | grep -vE '^site/|\.md$' || true)
          if [ -n "$code" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            printf 'Code changes:\n%s\n' "$code"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only the site and Markdown changed: skipping tests and the image build."
          fi

  test:
    name: Python tests + UI build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The record-store tests also run against Postgres (tests/test_revisions.py).
    # The health check asks over TCP: while the image initialises the database
    # it runs a temporary server on the Unix socket only, which must not count.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 1s --health-timeout 5s --health-retries 60
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # One pytest worker per core (pytest-xdist), each test file on one
      # worker: only tests/test_revisions.py uses Postgres, and two workers
      # creating the schema in the empty database at once collide ("duplicate
      # key ... pg_type_typname_nsp_index"). xdist is added here rather than to
      # the `dev` extra: a change to pyproject.toml or uv.lock is a release.
      - name: Python tests
        env:
          EXUVIA_TEST_POSTGRES_URL: postgresql://postgres:ci@127.0.0.1:5432/postgres
        run: uv sync --extra dev --extra postgres --python 3.12 && uv run --with pytest-xdist==3.8.0 pytest -q -n auto --dist loadfile

      # The bun version matches mise.toml; the cache is bun's package cache,
      # keyed on the lockfile.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-ui-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-ui-${{ runner.os }}-

      - name: UI typecheck + build
        run: cd ui && bun install --frozen-lockfile && bun run build

      - name: Views runtime unit tests
        run: cd ui && bun run test

      - name: CLI smoke (run example DAG headless)
        run: uv run exuvia run examples/markets && uv run exuvia status examples/markets

  container:
    name: Executor image + remote run
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      # The cluster takes about 40 s to come up and needs nothing from the
      # image, so it starts now and comes up while the image builds.
      - name: Start a kind cluster (in the background)
        run: .github/scripts/bg.sh start kind-cluster kind create cluster --name exuvia --wait 120s

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build image
        run: docker build -t exuvia:ci .

      # Loading the image into the cluster and rolling the hub out takes about
      # 25 s; the steps up to the Kubernetes one run meanwhile.
      - name: Deploy to the kind cluster (in the background)
        run: .github/scripts/bg.sh start kind-deploy .github/scripts/kind-deploy.sh

      - name: Start executor container
        run: |
          docker run -d --name exuvia-exec -p 8080:8080 -e EXUVIA_EXECUTOR_TOKEN=ci-token exuvia:ci
          for _ in $(seq 1 60); do curl -fs http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs exuvia-exec; exit 1

      - name: Run the example DAG on the container
        env:
          EXUVIA_EXECUTOR_URL: http://127.0.0.1:8080
          EXUVIA_EXECUTOR_TOKEN: ci-token
        run: |
          uv sync --python 3.12
          uv run exuvia run examples/markets
          uv run exuvia status examples/markets | tee status.txt
          ! grep -vq "fresh" status.txt

      - name: Hub end-to-end (the same image, driven over HTTP)
        env:
          CONTAINER_ENGINE: docker
          E2E_IMAGE: exuvia:ci
          E2E_SKIP_BUILD: "1"
        run: python3 tests/e2e/container_e2e.py

      # The deploy/ recipes, each brought up with the image built above and
      # tested with the same script in URL mode.
      - name: Deploy with Compose (deploy/compose.yaml)
        env:
          EXUVIA_IMAGE: exuvia:ci
          EXUVIA_API_TOKEN: ci-token
          EXUVIA_PORT: "7420"
          E2E_URL: http://127.0.0.1:7420
          E2E_TOKEN: ci-token
        run: |
          docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 120
          python3 tests/e2e/container_e2e.py || { docker compose -f deploy/compose.yaml logs; exit 1; }
          docker compose -f deploy/compose.yaml down -v

      - name: Deploy as a Swarm stack (deploy/swarm.yaml)
        env:
          EXUVIA_IMAGE: exuvia:ci
          EXUVIA_PORT: "7421"
          E2E_URL: http://127.0.0.1:7421
          E2E_TOKEN: ci-token
        run: |
          docker swarm init
          docker node update --label-add exuvia=true "$(docker node ls -q)"
          printf ci-token | docker secret create exuvia_api_token -
          docker stack deploy -c deploy/swarm.yaml --resolve-image never --detach=false exuvia
          python3 tests/e2e/container_e2e.py || { docker service ps --no-trunc exuvia_hub; docker service logs exuvia_hub; exit 1; }
          docker stack rm exuvia

      - name: Deploy to Kubernetes on kind (deploy/kubernetes.yaml)
        env:
          E2E_URL: http://127.0.0.1:7422
          E2E_TOKEN: ci-token
        run: |
          diagnose() { kubectl -n exuvia get all,pvc || true; kubectl -n exuvia describe pods || true; kubectl -n exuvia logs deployment/exuvia-hub --all-containers || true; }
          .github/scripts/bg.sh wait kind-deploy 420 || { diagnose; exit 1; }
          kubectl -n exuvia port-forward service/exuvia-hub 7422:7420 >/tmp/port-forward.log 2>&1 &
          python3 tests/e2e/container_e2e.py || { diagnose; cat /tmp/port-forward.log; exit 1; }

      - name: Executor logs
        if: always()
        run: docker logs exuvia-exec || true
